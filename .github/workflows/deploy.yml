name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build GitHub Pages site
        run: npm run build:public
        env:
          SITE: https://969528307-cyber.github.io
          BASE: /agent-html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Build Hostinger site
        run: npm run build:public
        env:
          SITE: https://2playclaw.com
          BASE: /
      - name: Upload Hostinger dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dist
          path: site/dist
          retention-days: 1

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-hostinger:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download public dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hostinger-dist
          path: dist
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          cd dist
          lftp <<EOF
          set net:timeout 25;
          set net:max-retries 2;
          set net:reconnect-interval-base 5;
          set ftp:ssl-allow no;
          set ftp:passive-mode yes;
          open $FTP_HOST;
          user $FTP_USER $FTP_PASS;
          mirror -R --only-newer . /public_html/ --parallel=1 --verbose=1;
          quit
          EOF
      - name: Verify Hostinger tools page
        run: |
          html="$(curl -fsSL --retry 3 --retry-delay 10 "https://2playclaw.com/tools/?deploy=${GITHUB_SHA}")"
          echo "$html" | grep -q "Tools directory"
          echo "$html" | grep -q "/item/"
