name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build GitHub Pages site
        run: npm run build:public
        env:
          SITE: https://969528307-cyber.github.io
          BASE: /agent-html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Build Hostinger site
        run: npm run build:public
        env:
          SITE: https://2playclaw.com
          BASE: /
      - name: Mark Hostinger tools build
        run: printf '\n<!-- deploy:%s -->\n' "$GITHUB_SHA" >> dist/tools/index.html
      - name: Upload Hostinger dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dist
          path: site/dist
          retention-days: 1

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-hostinger:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Download public dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hostinger-dist
          path: dist
      - name: Deploy Hostinger public pages
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          cd dist

          ftp_base="${FTP_HOST%/}"
          case "$ftp_base" in
            ftp://*|ftps://*) ;;
            *) ftp_base="ftp://$ftp_base" ;;
          esac

          upload_file() {
            local file="$1"
            local remote="${file#./}"
            echo "Uploading $remote"
            curl --fail --silent --show-error \
              --ftp-create-dirs \
              --connect-timeout 20 \
              --max-time 90 \
              --retry 2 \
              --retry-delay 5 \
              --upload-file "$file" \
              "$ftp_base/public_html/$remote" \
              --user "$FTP_USER:$FTP_PASS"
          }

          upload_tree() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            find "$dir" -type f -print0 | sort -z | while IFS= read -r -d '' file; do
              upload_file "$file"
            done
          }

          for file in index.html favicon.svg favicon.ico robots.txt sitemap.xml rss.xml tools/index.html; do
            [ -f "$file" ] && upload_file "$file"
          done

          for dir in _astro tools type category agents search learn signals for upgrade; do
            upload_tree "$dir"
          done
      - name: Deploy Hostinger item pages
        continue-on-error: true
        timeout-minutes: 12
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          cd dist

          ftp_base="${FTP_HOST%/}"
          case "$ftp_base" in
            ftp://*|ftps://*) ;;
            *) ftp_base="ftp://$ftp_base" ;;
          esac

          find item -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            remote="${file#./}"
            echo "Uploading $remote"
            curl --fail --silent --show-error \
              --ftp-create-dirs \
              --connect-timeout 20 \
              --max-time 90 \
              --retry 2 \
              --retry-delay 5 \
              --upload-file "$file" \
              "$ftp_base/public_html/$remote" \
              --user "$FTP_USER:$FTP_PASS"
          done
      - name: Verify Hostinger tools page
        run: |
          html="$(curl -fsSL --retry 3 --retry-delay 10 "https://2playclaw.com/tools/?deploy=${GITHUB_SHA}")"
          echo "$html" | grep -q "Tools directory"
          echo "$html" | grep -q "/item/"
          echo "$html" | grep -q "deploy:${GITHUB_SHA}"
